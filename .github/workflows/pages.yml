name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage served files only
        run: |
          set -euo pipefail
          JS=$(grep -o 'src="\./[^"]*\.js"' index.html | head -1 | sed 's/src="\.\///;s/"$//')
          CSS_LIST=$(grep -o 'href="\./[^"]*\.css"' index.html | sed 's/href="\.\///;s/"$//')
          mkdir _site
          cp index.html .nojekyll "$JS" _site/
          for f in $CSS_LIST; do cp "$f" _site/; done
          [ ! -d assets ] || cp -r assets _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
