name: Restore clean portrait asset names
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip web-upload sequence prefixes from assets
        run: |
          cd assets
          before=$(ls *.webp 2>/dev/null | wc -l)
          echo "webp files before: $before"
          for f in *.webp; do
            clean="${f#*-}"
            if [ "$f" != "$clean" ]; then
              if [ -e "$clean" ]; then
                echo "dup removed: $f"
                git rm -q "$f"
              else
                git mv "$f" "$clean"
              fi
            fi
          done
          after=$(ls *.webp | wc -l)
          prefixed=$(ls | grep -c '^[0-9]*-' || true)
          echo "webp files after: $after, still prefixed: $prefixed"
          git add -A .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore clean portrait asset names after web upload" || echo "no changes"
          git push
